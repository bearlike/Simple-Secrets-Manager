server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind a reverse proxy, emit RELATIVE redirects so nginx never bakes its
    # internal listen port (:8080) into the Location header. Without this, the
    # `/api` -> `/api/` redirect below leaks `http://<host>:8080/api/`, which
    # external API clients (the ssm CLI) can't reach — see issue #2.
    absolute_redirect off;

    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swaggerui/ {
        proxy_pass http://127.0.0.1:5000/swaggerui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
