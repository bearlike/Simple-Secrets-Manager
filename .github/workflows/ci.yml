name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"
      - ".github/workflows/publish-preview.yml"
      - "Dockerfile"
      - "deploy/**"
      - "frontend/**"
      - "ssm_server/**"
      - "ssm_cli/**"
      - "ssm_reload/**"
      - "ssm_contracts/**"
      - "ssm_telemetry/**"
      - "pyproject.toml"
      - "uv.lock"
      - "VERSION"
      - "scripts/version_sync.py"
  push:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"
      - ".github/workflows/publish-preview.yml"
      - "Dockerfile"
      - "deploy/**"
      - "frontend/**"
      - "ssm_server/**"
      - "ssm_cli/**"
      - "ssm_reload/**"
      - "ssm_contracts/**"
      - "ssm_telemetry/**"
      - "pyproject.toml"
      - "uv.lock"
      - "VERSION"
      - "scripts/version_sync.py"
  workflow_dispatch:

jobs:
  docker-build:
    name: Build ${{ matrix.name }} image (no publish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: simple-secrets-manager
            dockerfile: Dockerfile
            build_args_extra: |
              VITE_API_BASE_URL=/api
          - name: ssm-reload
            dockerfile: ssm_reload/Dockerfile
            build_args_extra: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate version wiring
        run: python3 scripts/version_sync.py --check

      - name: Resolve app version
        id: version
        run: python3 scripts/version_sync.py --github-output "${GITHUB_OUTPUT}"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            ${{ matrix.build_args_extra }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
